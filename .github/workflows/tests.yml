name: RAG usability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: RAG/frontend/package-lock.json
      - run: npm ci
        working-directory: RAG/frontend
      - run: npm run build
        working-directory: RAG/frontend
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -e .
      - run: .venv\Scripts\python.exe -m unittest discover -s RAG/tests -p "test_*.py" -v
      - run: .venv\Scripts\python.exe -m unittest discover -s agent/tests -p "test_*.py" -v
      - run: .venv\Scripts\python.exe -m unittest discover -s benchmark/tests -p "test_*.py" -v
      - run: .venv\Scripts\python.exe -m tests.smoke
