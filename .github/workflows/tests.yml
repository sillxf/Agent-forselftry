name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rag_models:
        description: Run real PDF and OCR corpus tests (downloads model artifacts)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=test-results/default.xml
      - name: Full corpus including PDF and OCR
        if: github.event_name == 'workflow_dispatch' && inputs.rag_models
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: python -m pytest -q --rag-models --junitxml=test-results/with-models.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-results
          path: test-results/*.xml
          retention-days: 14
